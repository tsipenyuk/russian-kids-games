<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Русская клавиатура для детей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="home-link" href="../index.html">&larr; На главную</a>
    <div class="game-container">
        <div class="header">
            <h1>🇷🇺 Учим русские буквы! 🇷🇺</h1>
            <div class="controls">
                <label for="letterCount">Количество букв: <span id="letterCountValue">5</span></label>
                <input type="range" id="letterCount" min="1" max="33" value="5" class="letter-slider">
                <div class="enabled-letters">
                    <span>Изучаем: </span><span id="enabledLettersDisplay">А, О, В, Л, Д</span>
                </div>
            </div>
            <div class="score">Счёт: <span id="score">0</span>/20 • Осталось: <span id="remaining">20</span></div>
        </div>
        
        <div class="letter-display">
            <div class="current-letter" id="currentLetter">А</div>
            <div class="instruction">Нажми эту букву на клавиатуре!</div>
        </div>
        
        <div class="animation-area" id="animationArea">
            <div class="success-animation" id="successAnimation">
                <div class="star">⭐</div>
                <div class="star">⭐</div>
                <div class="star">⭐</div>
                <div class="message">Отлично!</div>
            </div>
            
            <div class="error-animation" id="errorAnimation">
                <div class="sad-face">😢</div>
                <div class="message">Попробуй ещё раз!</div>
            </div>
        </div>
        
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="keyboard-hint">
            <p>Переключи клавиатуру на русский язык и нажми нужную букву!</p>
        </div>
    </div>
