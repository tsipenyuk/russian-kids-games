<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прыгающие слоги</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="home-link" href="../index.html">&larr; На главную</a>

    <div class="game-container">
        <h1>Прыгающие слоги</h1>

        <div class="controls">
            <button type="button" class="open-letters-btn" id="openLettersBtn">
                Буквы: <span id="letterCountBadge"></span>
            </button>
            <label class="speed-control">
                Скорость падения:
                <input type="range" id="speed" min="1" max="10" value="4">
            </label>
        </div>

        <p class="empty-warning" id="emptyWarning" hidden>
            Выберите хотя бы одну согласную и одну гласную или знак.
        </p>

        <dialog class="letters-modal" id="lettersModal">
            <div class="modal-header">
                <h2>Буквы</h2>
                <button type="button" class="modal-close" id="closeLettersBtn" aria-label="Закрыть">&times;</button>
            </div>

            <label class="letter-count-control">
                Количество букв: <span id="letterCountValue">8</span>
                <input type="range" id="letterCount" min="3" max="33" value="8">
            </label>

            <div class="letter-toggle-groups">
                <fieldset>
                    <legend>Согласные</legend>
                    <label><input type="checkbox" data-letter="б"> б</label>
                    <label><input type="checkbox" data-letter="в"> в</label>
                    <label><input type="checkbox" data-letter="г"> г</label>
                    <label><input type="checkbox" data-letter="д"> д</label>
                    <label><input type="checkbox" data-letter="ж"> ж</label>
                    <label><input type="checkbox" data-letter="з"> з</label>
                    <label><input type="checkbox" data-letter="й"> й</label>
                    <label><input type="checkbox" data-letter="к"> к</label>
                    <label><input type="checkbox" data-letter="л"> л</label>
                    <label><input type="checkbox" data-letter="м"> м</label>
                    <label><input type="checkbox" data-letter="н"> н</label>
                    <label><input type="checkbox" data-letter="п"> п</label>
                    <label><input type="checkbox" data-letter="р"> р</label>
                    <label><input type="checkbox" data-letter="с"> с</label>
                    <label><input type="checkbox" data-letter="т"> т</label>
                    <label><input type="checkbox" data-letter="ф"> ф</label>
                    <label><input type="checkbox" data-letter="х"> х</label>
                    <label><input type="checkbox" data-letter="ц"> ц</label>
                    <label><input type="checkbox" data-letter="ч"> ч</label>
                    <label><input type="checkbox" data-letter="ш"> ш</label>
                    <label><input type="checkbox" data-letter="щ"> щ</label>
                </fieldset>
                <fieldset>
                    <legend>Гласные</legend>
                    <label><input type="checkbox" data-letter="а"> а</label>
                    <label><input type="checkbox" data-letter="е"> е</label>
                    <label><input type="checkbox" data-letter="ё"> ё</label>
                    <label><input type="checkbox" data-letter="и"> и</label>
                    <label><input type="checkbox" data-letter="о"> о</label>
                    <label><input type="checkbox" data-letter="у"> у</label>
                    <label><input type="checkbox" data-letter="ы"> ы</label>
                    <label><input type="checkbox" data-letter="э"> э</label>
                    <label><input type="checkbox" data-letter="ю"> ю</label>
                    <label><input type="checkbox" data-letter="я"> я</label>
                </fieldset>
                <fieldset>
                    <legend>Знаки</legend>
                    <label><input type="checkbox" data-letter="ъ"> ъ</label>
                    <label><input type="checkbox" data-letter="ь"> ь</label>
                </fieldset>
            </div>
        </dialog>

        <div class="stage" id="stage">
            <div class="level-badge" title="Уровень">
                <button type="button" class="star" id="star" aria-label="Звезда">★</button>
                <span class="level-number" id="levelNumber">1</span>
            </div>
            <div class="next-preview" id="nextPreview" title="Следующий слог"></div>
            <div class="falling-syllable" id="fallingSyllable"></div>
            <div class="slots" id="slots">
                <button type="button" class="slot" data-slot="0"><span></span></button>
                <button type="button" class="slot" data-slot="1"><span></span></button>
                <button type="button" class="slot" data-slot="2"><span></span></button>
                <button type="button" class="slot" data-slot="3"><span></span></button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
